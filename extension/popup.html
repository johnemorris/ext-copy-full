<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SnapFull</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-badge {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .title { font-size: 15px; font-weight: 700; }
    .subtitle { font-size: 11px; color: var(--text-muted); }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
    }
    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .toggles-group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(14px); background-color: #0f172a; }

    .footer {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }
    .kbd {
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e2e8f0;
      font-family: monospace;
      font-size: 10px;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 11px;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-row">
      <div class="icon-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
      <div>
        <div class="title">SnapFull</div>
        <div class="subtitle">DevTools Full Page Capture</div>
      </div>
    </div>
    <a href="#" id="openOptions" title="Settings">⚙️</a>
  </div>

  <button class="btn-primary" id="btnCapture">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><polyline points="9 11 12 14 22 4"/></svg>
    <span>Capture to Clipboard</span>
  </button>

  <button class="btn-secondary" id="btnCaptureAndEdit" style="width: 100%; margin-top: 6px; background: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 10px; padding: 10px 14px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s ease;">
    <span>✏️ Capture & Open Editor (Crop/Blur)</span>
  </button>

  <div class="status-msg" id="statusBox"></div>

  <div class="toggles-group">
    <div class="toggle-row">
      <div class="toggle-label">
        <span>📋</span> Auto-Copy to Clipboard
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleClipboard" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <div class="toggle-label">
        <span>🎨</span> Open in Editor after capture
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleEditor">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <div class="toggle-label">
        <span>💾</span> Save to File (PNG)
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleDownload">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <div class="toggle-label">
        <span>⚡</span> Lazy-Scroll Warmup
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleWarmup" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="footer">
    <span>Shortcut: <span class="kbd">Alt+Shift+S</span></span>
    <span id="engineBadge" style="color: #38bdf8;">DevTools CDP</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>

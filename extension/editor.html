<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SnapFull Image Editor & Redaction</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    header {
      height: 52px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
    }
    .tools {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #020617;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .btn-tool {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-tool:hover { color: #f8fafc; background: #1e293b; }
    .btn-tool.active { background: #38bdf8; color: #020617; }
    .btn-tool.active-blur { background: #ef4444; color: #ffffff; }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-action {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-action:hover { background: #334155; }
    .btn-primary {
      background: #38bdf8;
      border: none;
      color: #020617;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary:hover { background: #7dd3fc; }

    .sub-bar {
      height: 38px;
      background: #090d16;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 11px;
      color: #94a3b8;
    }
    .workspace {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
    }
    canvas {
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid #334155;
      border-radius: 6px;
      display: block;
      background: #020617;
    }
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #059669;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span>SnapFull Editor</span>
    </div>

    <div class="tools">
      <button class="btn-tool active" id="toolCrop">
        <span>✂️ Crop</span>
      </button>
      <button class="btn-tool" id="toolBlur">
        <span>🔒 Blur / Redact</span>
      </button>
      <button class="btn-tool" id="toolText">
        <span>✏️ Text Note</span>
      </button>
      <button class="btn-tool" id="toolBox">
        <span>□ Box Frame</span>
      </button>
    </div>

    <div class="actions">
      <button class="btn-action" id="btnUndo">↶ Undo</button>
      <button class="btn-action" id="btnResetCrop">↺ Reset Crop</button>
      <button class="btn-primary" id="btnCopy">📋 Copy to Clipboard</button>
      <button class="btn-action" id="btnDownload">💾 Save PNG</button>
    </div>
  </header>

  <div class="sub-bar">
    <div id="statusInstruction">Drag to select a crop area. Release mouse to apply crop.</div>
    <div id="dimensionsDisplay">Loading screenshot...</div>
  </div>

  <div class="workspace" id="workspace">
    <canvas id="editorCanvas"></canvas>
  </div>

  <div id="toast">✓ Copied edited screenshot to system clipboard!</div>

  <script src="editor.js"></script>
</body>
</html>
